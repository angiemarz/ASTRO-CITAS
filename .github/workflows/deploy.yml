name: Publicar en Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Solo publica cuando ya configuraste los secretos de Cloudflare en GitHub
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificar secretos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::Falta CLOUDFLARE_API_TOKEN; se omite la publicación."; exit 0; fi
      - run: npm run build
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: npx wrangler d1 migrations apply astrobloomx-agenda --remote
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: npx wrangler deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
